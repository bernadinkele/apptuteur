security:
    # Hashage des mots de passe pour ton entité Tuteur
    password_hashers:
        App\Entity\Tuteur:
            algorithm: auto

    # Provider basé sur l'entité Tuteur (base de données)
    providers:
        tuteur_provider:
            entity:
                class: App\Entity\Tuteur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: tuteur_provider
            # Formulaire de connexion
            form_login:
                login_path: login
                check_path: login
                username_parameter: email
                password_parameter: password
            logout:
                path: logout
                target: login

    access_control:
        # Pages accessibles uniquement aux tuteurs authentifiés
        - { path: ^/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/, roles: ROLE_TUTEUR }

when@test:
    security:
        password_hashers:
            App\Entity\Tuteur:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
